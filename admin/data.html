<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Flosswork Site Data</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@800;900&family=Inter:wght@300;400;500;600;700&display=swap">
<style>
:root{--ink:#161614;--mute:#63635e;--line:#e4e3df;--bg:#fff;--soft:#f5f4f1;--accent:#163300;--ok:#2d6a0a;--okbg:#e2f6d5;--warn:#8a4a00;--warnbg:#fff2e5;--err:#9b1c12;--errbg:#fde8e5;--info:#2c4f7c;--infobg:#e8f0fa;--r:14px}
@media (prefers-color-scheme:dark){:root{--ink:#f1f0ec;--mute:#a3a29b;--line:#2f2f2b;--bg:#111110;--soft:#1b1b19;--accent:#9fe870;--ok:#9fe870;--okbg:#1f3310;--warn:#ffc58a;--warnbg:#3a2a12;--err:#ffb4ab;--errbg:#3d1a16;--info:#a9c8f2;--infobg:#17283d}}
*{box-sizing:border-box;margin:0}
body{font:15px/1.55 Inter,system-ui,-apple-system,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
a{color:inherit}
header.top{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{max-width:1200px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bar h1{font-size:16px;font-weight:700;letter-spacing:-.01em}
.bar .meta{color:var(--mute);font-size:12px;margin-left:auto}
button{font:inherit;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--soft);color:var(--ink);padding:6px 12px;border-radius:99px;cursor:pointer}
nav.jump{max-width:1200px;margin:0 auto;padding:0 16px 10px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
nav.jump a{flex:none;font-size:12.5px;text-decoration:none;color:var(--mute);border:1px solid var(--line);padding:4px 11px;border-radius:99px}
nav.jump a:hover{color:var(--ink);border-color:var(--ink)}
main{max-width:1200px;margin:0 auto;padding:16px}
section{margin:0 0 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);scroll-margin-top:96px}
summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";margin-left:auto;color:var(--mute);font-weight:400;font-size:20px;line-height:1}
.tools{display:flex;gap:6px;flex-wrap:wrap}
body.locked header.top,body.locked main{display:none}
.gate{position:fixed;inset:0;z-index:100;background:var(--bg);display:none;align-items:center;justify-content:center;padding:20px}
body.locked .gate{display:flex}
.gate form{width:100%;max-width:320px;display:grid;gap:12px;text-align:center}
.gate h1{font-size:18px}
.gate p{color:var(--mute);font-size:13px}
.gate input{font:600 24px/1 ui-monospace,Menlo,monospace;letter-spacing:.4em;text-align:center;padding:14px 10px;border:1px solid var(--line);border-radius:14px;background:var(--soft);color:var(--ink);width:100%}
.gate input:focus{outline:2px solid var(--accent);outline-offset:1px}
.gate button{padding:12px;font-size:15px}
.gate .err{color:var(--err);min-height:1.3em;font-size:13px}
.sws{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.swc{border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:11.5px;line-height:1.35}
.swc i{display:block;height:46px}.swc span{display:block;padding:5px 8px}.swc b{display:block;font-weight:600}
.spec{border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;gap:12px}
.btns{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sb{border:0;border-radius:99px;padding:11px 22px;font:600 14px Inter,system-ui,sans-serif}
details[open]>summary::after{content:"–"}
.count{font-size:12px;font-weight:600;color:var(--mute);background:var(--soft);padding:2px 9px;border-radius:99px}
.body{padding:0 16px 16px}
.note{color:var(--mute);font-size:13px;margin:0 0 10px}
.src{font-size:12px;color:var(--mute);margin:0 0 10px}
.src code{background:var(--soft);padding:1px 6px;border-radius:6px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);background:var(--soft);white-space:nowrap;font-weight:600}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;white-space:nowrap}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);margin:18px 0 8px;font-weight:600}
h3:first-child{margin-top:0}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.kv div{border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.kv b{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);font-weight:600}
.kv span{word-break:break-word}
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 9px;border-radius:99px;white-space:nowrap}
.p-ok{background:var(--okbg);color:var(--ok)}.p-warn{background:var(--warnbg);color:var(--warn)}.p-err{background:var(--errbg);color:var(--err)}.p-info{background:var(--infobg);color:var(--info)}.p-mute{background:var(--soft);color:var(--mute)}
.issues{display:grid;gap:6px}
.issue{display:flex;gap:10px;align-items:flex-start;border-radius:10px;padding:9px 12px;font-size:13.5px}
.issue.warn{background:var(--warnbg);color:var(--warn)}.issue.err{background:var(--errbg);color:var(--err)}.issue.info{background:var(--infobg);color:var(--info)}.issue.ok{background:var(--okbg);color:var(--ok)}
.issue b{flex:none;text-transform:uppercase;font-size:11px;letter-spacing:.05em;padding-top:2px;min-width:44px}
.sw{display:inline-block;width:18px;height:18px;border-radius:5px;border:1px solid var(--line);vertical-align:-4px;margin-right:8px}
.thumb{width:56px;height:42px;object-fit:cover;border-radius:6px;background:var(--soft);display:block}
.tags span{display:inline-block;background:var(--soft);padding:1px 8px;border-radius:99px;font-size:12px;margin:0 4px 4px 0}
.faqs details{border-bottom:1px solid var(--line);padding:8px 0}
.faqs details:last-child{border-bottom:0}
.faqs summary{padding:0;font-size:14px;font-weight:600}
.faqs summary::after{content:none}
.faqs p{color:var(--mute);font-size:13.5px;margin:6px 0 0}
.chips span{display:inline-block;background:var(--soft);border:1px solid var(--line);padding:2px 10px;border-radius:99px;font-size:13px;margin:0 6px 6px 0}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}
.loading{color:var(--mute);font-size:13px}
@media (max-width:640px){summary{font-size:15px}.bar .meta{margin-left:0;width:100%}}
</style>
</head>
<body class="locked">
<div class="gate"><form id="gate-form" autocomplete="off">
  <h1>Flosswork · Site data</h1>
  <p>Enter the PIN to continue.</p>
  <input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="12" aria-label="PIN" required>
  <button type="submit">Unlock</button>
  <div class="err" id="gate-err" role="alert"></div>
</form></div>
<header class="top">
  <div class="bar">
    <h1>Flosswork · Site data</h1>
    <span class="tools"><button id="reload" type="button">Reload from live site</button><button id="lock" type="button">Lock</button></span>
    <span class="meta" id="meta">Loading…</span>
  </div>
  <nav class="jump" id="jump"></nav>
</header>
<main id="main"><p class="loading">Reading the site…</p></main>

<script>
(function () {
  'use strict';
  var BASE = new URL('../', location.href);           // site root, whatever the host
  var SECTIONS = [
    ['attention', 'Needs attention'], ['festivals', 'Festival themes'],
    ['clinic', 'Clinic'], ['consistency', 'Consistency'], ['doctors', 'Doctors'], ['faq', 'FAQ'], ['images', 'Images'],
    ['integrations', 'Integrations'], ['links', 'Links'], ['locations', 'Locations'], ['perf', 'Page weight'], ['seo', 'SEO'],
    ['sitemap', 'Site map'], ['theme', 'Theme'], ['treatments', 'Treatments & prices'], ['whatsapp', 'WhatsApp']
  ];

  /* ---------- tiny helpers ---------- */
  function h(tag, attrs, kids) {
    var e = document.createElement(tag);
    if (attrs) for (var k in attrs) { if (k === 'class') e.className = attrs[k]; else e.setAttribute(k, attrs[k]); }
    (function add(c) {
      if (c === null || c === false || c === undefined) return;
      if (Array.isArray(c)) return c.forEach(add);
      e.appendChild(typeof c === 'object' ? c : document.createTextNode(String(c)));
    })(kids);
    return e;
  }
  function pill(text, kind) { return h('span', { class: 'pill p-' + (kind || 'mute') }, text); }
  function money(p) { return p === null || p === undefined ? pill('Get a quote', 'mute') : '₹' + Number(p).toLocaleString('en-IN'); }
  function kb(n) { return n < 1024 ? n + ' B' : n < 1048576 ? (n / 1024).toFixed(0) + ' KB' : (n / 1048576).toFixed(1) + ' MB'; }
  function table(head, rows, numCols) {
    numCols = numCols || [];
    var t = h('table', null, [
      h('thead', null, h('tr', null, head.map(function (c, i) { return h('th', numCols.indexOf(i) > -1 ? { class: 'num' } : null, c); }))),
      h('tbody', null, rows.map(function (r) { return h('tr', null, r.map(function (c, i) { return h('td', numCols.indexOf(i) > -1 ? { class: 'num' } : null, c); })); }))
    ]);
    return h('div', { class: 'tw' }, t);
  }
  function kv(pairs) { return h('div', { class: 'kv' }, pairs.map(function (p) { return h('div', null, [h('b', null, p[0]), h('span', null, p[1] === '' || p[1] == null ? pill('empty', 'warn') : p[1])]); })); }
  function link(href, text) { return h('a', { href: href, target: '_blank', rel: 'noopener' }, text || href); }
  function get(url, opts) { return fetch(url + (url.indexOf('?') > -1 ? '&' : '?') + '_=' + Date.now(), Object.assign({ cache: 'no-store' }, opts || {})); }
  function pool(items, n, fn) {
    var i = 0, out = new Array(items.length);
    return Promise.all(Array.from({ length: n }, function () {
      return (function next() { if (i >= items.length) return Promise.resolve(); var k = i++; return Promise.resolve(fn(items[k], k)).then(function (r) { out[k] = r; return next(); }); })();
    })).then(function () { return out; });
  }

  /* ---------- state ---------- */
  var FW, issues, pages, imgs, waRows = [], extra = {}, openState = {};
  function say(level, area, msg) { issues.push({ level: level, area: area, msg: msg }); }

  /* ---------- load ---------- */
  function loadConfig() {
    return new Promise(function (res, rej) {
      delete window.FW;
      var s = document.createElement('script');
      s.src = new URL('config.js', BASE).href + '?_=' + Date.now();
      s.onload = function () { s.remove(); window.FW ? res(window.FW) : rej(new Error('config.js loaded but window.FW is missing')); };
      s.onerror = function () { rej(new Error('Could not load config.js')); };
      document.head.appendChild(s);
    });
  }
  function fetchPage(path) {
    var clean = path.replace(/^\/+/, '');
    var tries = clean ? [clean, clean + '.html'] : ['index.html'];
    function attempt(i) {
      if (i >= tries.length) return Promise.resolve({ path: path, ok: false, status: 404 });
      var u = new URL(tries[i], BASE).href;
      return get(u).then(function (r) {
        if (!r.ok) return attempt(i + 1);
        return r.text().then(function (t) {
          if (/<title>404/i.test(t.slice(0, 2000)) && tries[i] !== '404.html') return attempt(i + 1);
          var doc = new DOMParser().parseFromString(t, 'text/html');
          return { path: path, url: u, ok: true, status: r.status, html: t, doc: doc, text: doc.body ? doc.body.textContent.replace(/\s+/g, ' ') : '' };
        });
      }).catch(function () { return attempt(i + 1); });
    }
    return attempt(0);
  }
  function resolveAsset(src, pageUrl) {
    try {
      var u = new URL(src, pageUrl);
      if (u.hostname === 'flosswork.in') u = new URL(u.pathname.replace(/^\//, ''), BASE);
      return u.origin === BASE.origin ? u.href.split('#')[0].split('?')[0] : null;
    } catch (e) { return null; }
  }
  function textOf(p, sel) { var n = p.doc && p.doc.querySelector(sel); return n ? n.textContent.replace(/\s+/g, ' ').trim() : ''; }
  function metaOf(p, name) { var n = p.doc && p.doc.querySelector('meta[name="' + name + '"],meta[property="' + name + '"]'); return n ? (n.getAttribute('content') || '') : ''; }

  /* ---------- sections ---------- */
  function sec(id, title, count, nodes) {
    var d = h('details', { id: id }, [h('summary', null, [title, count != null ? h('span', { class: 'count' }, count) : null]), h('div', { class: 'body' }, nodes)]);
    d.open = openState[id] !== undefined ? openState[id] : (innerWidth > 700 || id === 'attention' || id === 'theme');
    d.addEventListener('toggle', function () { openState[id] = d.open; });
    var s = h('section', null, d);
    return s;
  }
  function src(files) { return h('p', { class: 'src' }, ['Read live from ', files.map(function (f, i) { return [i ? ', ' : '', h('code', null, f)]; })]); }

  function activeNow() {
    var F = X.fest, today = todayIST(), live = F && F.live, pairs = [];
    var next = F && F.rows ? F.rows.filter(function (r) { return r.f.from > today; }).sort(function (a, b) { return a.f.from < b.f.from ? -1 : 1; })[0] : null;
    pairs.push(['Active theme', live ? [live.label || live.id, ' ', pill('festival', 'info'), ' until ' + fmtDate(live.to)] : ['Original theme ', pill('everyday', 'ok'), F && F.sch && !F.sch.enabled ? ' (festival themes switched off)' : '']]);
    pairs.push(['Next theme change', live ? 'Back to the original theme after ' + fmtDate(live.to) : next ? (next.f.label || next.f.id) + ' starts ' + fmtDate(next.f.from) + ' (' + next.status + ')' : pill('nothing scheduled', 'mute')]);
    return h('div', { class: 'kv' }, pairs.map(function (p) { return h('div', null, [h('b', null, p[0]), h('span', null, p[1])]); }));
  }
  function renderAttention() {
    var order = { err: 0, warn: 1, info: 2, ok: 3 };
    var list = issues.slice().sort(function (a, b) { return order[a.level] - order[b.level]; });
    var counts = { err: 0, warn: 0 };
    issues.forEach(function (i) { if (counts[i.level] !== undefined) counts[i.level]++; });
    var nodes = [h('h3', null, 'Active now'), activeNow(), h('h3', null, 'To review'), h('p', { class: 'note' }, 'Checks run every time this page loads. Errors and warnings need a decision; info is by design or optional.')];
    if (!list.length) nodes.push(h('div', { class: 'issue ok' }, [h('b', null, 'ok'), 'Nothing to flag.']));
    else nodes.push(h('div', { class: 'issues' }, list.map(function (i) { return h('div', { class: 'issue ' + i.level }, [h('b', null, i.level), h('span', null, [h('strong', null, i.area + ': '), i.msg])]); })));
    var badge = counts.err + counts.warn;
    return sec('attention', 'Needs attention', badge ? badge + ' to review' : 'all clear', nodes);
  }

  function renderClinic() {
    var c = FW.clinic;
    return sec('clinic', 'Clinic', null, [
      src(['config.js → clinic, trust']),
      kv([['Name', c.name], ['Tagline', c.tagline], ['Phone', c.phone], ['Phone 2', c.phone2], ['WhatsApp', c.whatsapp], ['Email', c.email],
          ['Hours', c.hoursLong], ['Google rating', c.rating + ' ★ · ' + c.reviewCount + ' reviews'], ['Google reviews', link(c.googleReviews)],
          ['Instagram', link(c.instagram)], ['Facebook', link(c.facebook)], ['Maps', link(c.maps)]]),
      h('h3', null, 'Trust strip'),
      table(['Value', 'Label'], (FW.trust || []).map(function (t) { return t.rating ? [c.rating + ' ★', 'Google rating (' + c.reviewCount + ' reviews)'] : [t.value, t.label]; })),
      h('h3', null, 'Equipment'),
      h('div', { class: 'chips' }, (FW.equipment || []).map(function (e) { return h('span', null, e); }))
    ]);
  }

  function renderTreatments() {
    var needs = {}; (FW.needs || []).forEach(function (n) { needs[n.key] = n; });
    var tiles = {}; (FW.tiles || []).forEach(function (t) { tiles[t.key] = t; });
    var rows = [], total = 0;
    (FW.services || []).forEach(function (g) {
      g.items.forEach(function (it) {
        total++;
        var n = needs[it.id];
        var onPage = pages.services && pages.services.ok ? pages.services.text.indexOf(it.name) > -1 : null;
        rows.push([it.name, g.title, n ? money(n.price) : pill('not in form', 'mute'), tiles[it.id] ? pill('home tile', 'info') : '', it.href || ('/services#' + it.id),
          it.img || pill('icon only', 'mute'), onPage === null ? '—' : onPage ? pill('shown', 'ok') : pill('missing on page', 'err')]);
      });
    });
    return sec('treatments', 'Treatments & prices', total + ' services', [
      src(['config.js → services, needs, tiles, moreTreatments', 'services.html']),
      h('p', { class: 'note' }, 'A price of “Get a quote” means price is null in config.js, which is deliberate for everything except aligners.'),
      table(['Treatment', 'Group', 'Price', 'Home', 'Links to', 'Image', 'On services page'], rows),
      h('h3', null, 'Booking form options (Plan your visit)'),
      table(['Key', 'Label', 'Pill', 'Price', 'Mode'], (FW.needs || []).map(function (n) { return [n.key, n.label, n.pill, money(n.price), n.mode ? pill(n.mode, 'warn') : '']; })),
      h('p', { class: 'note', style: 'margin-top:8px' }, 'Time options: ' + (FW.when || []).join(' · ')),
      h('h3', null, 'More treatments (chip list)'),
      h('div', { class: 'chips' }, (FW.moreTreatments || []).map(function (e) { return h('span', null, e); }))
    ]);
  }

  /* WhatsApp wording. These mirror bookText()/waText() in app.js; the check in collectWA() warns if app.js changes. */
  function lc(s) { return String(s).toLowerCase(); }
  function needBy(key) { return (FW.needs || []).filter(function (n) { return n.key === key; })[0]; }
  function bookMsg(key) {
    if (!key) return "Hi Flosswork, I'd like to book a consultation.";
    var n = needBy(key); if (!n) return "Hi Flosswork, I'd like to book a consultation.";
    if (n.mode === 'emergency') return 'Hi, I have a dental emergency and need urgent help.';
    if (n.key === 'other') return "Hi Flosswork, I'd like to book a consultation.";
    return "Hi Flosswork, I'd like to book a consultation for " + lc(n.label) + '.';
  }
  function planMsg(n, when) {
    if (n.mode === 'emergency') return 'Hi, I have a dental emergency and need urgent help.';
    if (n.key === 'other') return "Hi Flosswork, I'd like to book a consultation (" + lc(when) + ').';
    return "Hi Flosswork, I'd like to book a consultation for " + lc(n.label) + ' (' + lc(when) + ').';
  }
  function collectWA() {
    var rows = [], seen = {}, num = String(FW.clinic.whatsapp);
    Object.keys(pages).forEach(function (k) {
      var p = pages[k]; if (!p.ok) return; var nm = k || 'home';
      var pageNeed = (p.doc.body && p.doc.body.getAttribute('data-page-need')) || '';
      [].forEach.call(p.doc.querySelectorAll('a[data-wa], a[data-book], a[href*="wa.me/"]'), function (a) {
        var msg, kind, href = a.getAttribute('href') || '';
        if (a.hasAttribute('data-wa')) { msg = a.getAttribute('data-wa'); kind = 'Fixed message'; }
        else if (a.hasAttribute('data-book')) { msg = bookMsg(a.getAttribute('data-book') || pageNeed); kind = 'Book button'; }
        else {
          var m = href.match(/[?&]text=([^&#]*)/); try { msg = m ? decodeURIComponent(m[1]) : ''; } catch (e) { msg = m ? m[1] : ''; } kind = 'Fixed message';
          var wn = (href.match(/wa\.me\/(\d+)/) || [])[1]; if (wn && wn !== num) say('err', 'WhatsApp', nm + ' links to wa.me/' + wn + ', which is not the number in config.js.');
        }
        var label = (a.querySelector('b') || a).textContent.replace(/\s+/g, ' ').trim().slice(0, 60);
        var id = nm + '|' + kind + '|' + label + '|' + msg; if (seen[id]) return; seen[id] = 1;
        rows.push({ page: nm, label: label || '(icon)', msg: msg || '(none)', kind: kind });
      });
    });
    var order = Object.keys(pages);
    rows.sort(function (a, b) { return order.indexOf(a.page === 'home' ? '' : a.page) - order.indexOf(b.page === 'home' ? '' : b.page); });
    if (extra.appjs && (extra.appjs.indexOf("I'd like to book a consultation for") < 0 || extra.appjs.indexOf('dental emergency and need urgent help') < 0))
      say('warn', 'WhatsApp', 'The booking wording in app.js has changed. The “Booking form messages” table here may no longer match; update this page.');
    return rows;
  }
  function renderWhatsApp(rows) {
    var form = [];
    (FW.needs || []).forEach(function (n) {
      if (n.mode === 'emergency') form.push([n.label, '—', planMsg(n), 'Opens WhatsApp or call-now panel']);
      else (FW.when || []).forEach(function (w, i) { form.push([i ? '' : n.label, w, planMsg(n, w), i ? '' : 'Plan your visit / booking form']); });
    });
    return sec('whatsapp', 'WhatsApp messages', rows.length + ' buttons', [
      src(['config.js → clinic.whatsapp, needs, when', 'every page’s WhatsApp buttons', 'app.js (wording check)']),
      kv([['Number', '+' + FW.clinic.whatsapp], ['Chat link', link('https://wa.me/' + FW.clinic.whatsapp)]]),
      h('h3', null, 'Buttons on pages'),
      h('p', { class: 'note' }, '“Book button” messages are built by the site from config.js; “Fixed message” text is written into the page.'),
      table(['Page', 'Button', 'Type', 'Message sent'], rows.map(function (r) { return [r.page, r.label, pill(r.kind, r.kind === 'Book button' ? 'info' : 'mute'), r.msg]; })),
      h('h3', null, 'Booking form messages (need × time)'),
      table(['Need', 'When', 'Message sent', 'Where'], form)

    function has(p, s) { return p && p.ok && (p.text.indexOf(s) > -1 || p.html.indexOf(s) > -1); }
    if (contact.ok && !has(contact, c.phone) && !has(contact, digits(c.phone).slice(-10))) say('err', 'Out of sync', 'Phone ' + c.phone + ' from config.js is not on the contact page. Re-run node tools/build-site.js.');
    if (contact.ok && !has(contact, c.whatsapp)) say('warn', 'Out of sync', 'WhatsApp number from config.js is not on the contact page.');
    if (home.ok && !has(home, c.reviewCount)) say('warn', 'Out of sync', 'Review count ' + c.reviewCount + ' from config.js is not on the home page.');
    (FW.doctors || []).filter(function (d) { return d.active; }).forEach(function (d) {
      var shown = Object.keys(P).some(function (k) { return has(P[k], d.name) || has(P[k], d.short); });
      if (!shown && Object.keys(P).length) say('err', 'Out of sync', d.name + ' is active in config.js but appears on no page. Re-run node tools/build-site.js.');
    });
    var al = (FW.needs || []).filter(function (n) { return n.key === 'aligners'; })[0];
    if (al && al.price && aligners.ok && !has(aligners, Number(al.price).toLocaleString('en-IN'))) say('warn', 'Out of sync', 'Aligner price ₹' + Number(al.price).toLocaleString('en-IN') + ' from config.js is not on the aligners page.');
    var sv = P.services;
    if (sv && sv.ok) (FW.services || []).forEach(function (g) { g.items.forEach(function (it) { if (sv.text.indexOf(it.name) < 0) say('err', 'Out of sync', '“' + it.name + '” is in config.js but not on the services page.'); }); });
    var paths = Object.keys(P);
    (FW.tiles || []).forEach(function (t) {
      var base = (t.href || '').split('#')[0].replace(/^\//, '');
      if (base && paths.indexOf(base) < 0) say('warn', 'Links', 'Home tile “' + t.name + '” links to /' + base + ', which is not in the site map.');
    });
    var nq = (FW.needs || []).filter(function (n) { return n.price === null; }).length;
    if (nq) say('info', 'Prices', nq + ' of ' + FW.needs.length + ' booking options have no price and show “Get a quote”.');
    (FW.doctors || []).forEach(function (d) { if (d.active && !d.photo) say('warn', 'Doctors', d.name + ' has no photo; the card shows initials.'); });
    var nopic = (FW.cases || []).filter(function (x) { return !x.before || !x.after; }).length;
    if (nopic) say('info', 'Cases', nopic + ' of ' + FW.cases.length + ' aligner cases have no before/after photos yet.');
    if (!FW.leadEndpoint) say('warn', 'Leads', 'leadEndpoint is empty, so booking-form leads are not saved anywhere.');
    if (!(FW.analytics || {}).ga4Id && !(FW.analytics || {}).gtmId) say('warn', 'Analytics', 'No GA4 or GTM ID is set.');
  }

  function pageChecks(rows) {
    rows.forEach(function (r) {
      var n = r.path || '/';
      if (!r.ok) return say('err', 'Site map', n + ' is in sitemap.xml but could not be loaded.');
      if (!r.title) say('err', n, 'No <title>.'); else if (r.title.length > 60) say('warn', n, 'Title is ' + r.title.length + ' characters (aim for 60 or less).');
      if (!r.desc) say('err', n, 'No meta description.'); else if (r.desc.length > 160 || r.desc.length < 70) say('warn', n, 'Description is ' + r.desc.length + ' characters (aim for 70 to 160).');
      if (!r.h1) say('warn', n, 'No <h1>.'); else if (r.h1count > 1) say('warn', n, r.h1count + ' <h1> tags (use one).');
      if (r.noindex) say('warn', n, 'Page is marked noindex but is in the site map.');
      if (r.noalt) say('warn', n, r.noalt + ' image(s) without alt text.');
    });
  }

  /* ---------- run ---------- */
  function run() {
    issues = []; pages = {}; imgs = [];
    var main = document.getElementById('main');
    document.getElementById('meta').textContent = 'Loading…';
    extra = {}; waRows = [];
    var theme = null, sm = null, faq = [], smRows = [];

    return loadConfig().then(function (cfg) {
      FW = cfg;
      return Promise.all([
        get(new URL('sitemap.xml', BASE).href).then(function (r) { extra.sitemap = r.ok; return r.ok ? r.text() : ''; }).catch(function () { return ''; }),
        get(new URL('styles.css', BASE).href).then(function (r) { return r.ok ? r.text() : ''; }).catch(function () { return ''; }),
        get(new URL('robots.txt', BASE).href).then(function (r) { extra.robots = r.ok; }).catch(function () {}),
        get(new URL('llms.txt', BASE).href).then(function (r) { extra.llms = r.ok; }).catch(function () {}),
        get(new URL('_headers', BASE).href).then(function (r) { extra.headers = r.ok; }).catch(function () {}),
        get(new URL('app.js', BASE).href).then(function (r) { return r.ok ? r.text() : ''; }).then(function (t) { extra.appjs = t; }).catch(function () {}),
        get(new URL('config.js', BASE).href).then(function (r) { return r.ok ? r.text() : ''; }).then(function (t) { extra.cfgBytes = new Blob([t]).size; }).catch(function () {}),
        get(new URL('festival-themes/schedule.json', BASE).href).then(function (r) { return r.ok ? r.json() : null; }).then(function (j) { extra.fest = j; }).catch(function () { extra.fest = null; })
      ]);
    }).then(function (res) {
      var xml = new DOMParser().parseFromString(res[0] || '<x/>', 'application/xml');
      sm = [].map.call(xml.getElementsByTagName('url'), function (u) {
        var loc = (u.getElementsByTagName('loc')[0] || {}).textContent || '', lm = (u.getElementsByTagName('lastmod')[0] || {}).textContent || '';
        var path; try { path = new URL(loc).pathname.replace(/^\/+|\/+$/g, ''); } catch (e) { path = loc; }
        return { loc: loc, path: path, lastmod: lm };
      });
      if (res[1]) { theme = parseTheme(res[1]); extra.cssBytes = new Blob([res[1]]).size; }
      return pool(sm, 6, function (s) { return fetchPage(s.path).then(function (p) { pages[s.path] = p; return p; }); });
    }).then(function (list) {
      list.forEach(function (p, i) {
        var s = sm[i], row = { loc: s.loc, path: s.path, lastmod: s.lastmod, ok: p.ok };
        if (p.ok) {
          row.title = textOf(p, 'title'); row.desc = metaOf(p, 'description'); row.h1 = textOf(p, 'h1');
          row.h1count = p.doc.querySelectorAll('h1').length; row.noindex = /noindex/i.test(metaOf(p, 'robots'));
          row.noalt = [].filter.call(p.doc.querySelectorAll('img'), function (im) { return !im.hasAttribute('alt'); }).length;
          if (s.path === '' ) {
            var v = p.doc.querySelector('meta[name="google-site-verification"]'); if (v) extra.verification = v.getAttribute('content');
            if (theme) theme.fonts = [].map.call(p.doc.querySelectorAll('link[href*="fonts.googleapis"]'), function (l) { var m = (l.href.match(/family=([^:&]+)/) || [])[1]; return m ? decodeURIComponent(m).replace(/\+/g, ' ') : ''; }).filter(Boolean);
          }
        }
        smRows.push(row);
      });
      var fp = pages.faq;
      if (fp && fp.ok) {
        var cur = { title: 'Questions', items: [] };
        [].forEach.call(fp.doc.querySelectorAll('h2, details.q'), function (n) {
          if (n.tagName === 'H2') { cur = { title: n.textContent.replace(/\s+/g, ' ').trim(), items: [] }; faq.push(cur); }
          else {
            if (!faq.length) faq.push(cur);
            var q = n.querySelector('summary'), a = n.querySelector('.a');
            cur.items.push({ q: q ? q.textContent.replace(/\s+/g, ' ').trim() : '', a: a ? a.textContent.replace(/\s+/g, ' ').trim() : '' });
          }
        });
      }
      pageChecks(smRows); crossChecks(); waRows = collectWA();
      X = { locs: collectLocs(), cons: collectConsistency(), seo: collectSeo(smRows), links: null };
      collectFestivals();

      // collect images
      var seen = {};
      function add(u, pg) { if (!u) return; var e = seen[u]; if (!e) { e = seen[u] = { url: u, name: u.split('/').pop(), pages: [] }; imgs.push(e); } if (pg && e.pages.indexOf(pg) < 0) e.pages.push(pg); }
      function cfgImg(f, where) { if (f) add(new URL(f.indexOf('/') > -1 ? f : 'images/' + f, BASE).href, where); }
      (FW.services || []).forEach(function (g) { g.items.forEach(function (it) { cfgImg(it.img, 'config: ' + it.name); }); });
      (FW.cases || []).forEach(function (c) { cfgImg(c.before, 'config: cases'); cfgImg(c.after, 'config: cases'); });
      (FW.doctors || []).forEach(function (d) { cfgImg(d.photo, 'config: ' + d.short); });
      Object.keys(pages).forEach(function (k) {
        var p = pages[k]; if (!p.ok) return; var nm = k || 'home';
        [].forEach.call(p.doc.querySelectorAll('img[src],source[srcset],img[srcset],meta[property="og:image"]'), function (n) {
          var cands = [];
          if (n.getAttribute('src')) cands.push(n.getAttribute('src'));
          if (n.getAttribute('content')) cands.push(n.getAttribute('content'));
          (n.getAttribute('srcset') || '').split(',').forEach(function (s) { s = s.trim().split(/\s+/)[0]; if (s) cands.push(s); });
          cands.forEach(function (c) { if (/^data:/.test(c)) return; add(resolveAsset(c, p.url), nm); });
        });
      });

      // render everything but the image table first
      draw(smRows, theme, faq, extra, sm);
      document.getElementById('meta').textContent = 'Checking ' + imgs.length + ' images…';
      var linksDone = checkLinks().catch(function (e) { X.links = []; say('warn', 'Links', 'Link check failed: ' + e.message); });
      var festDone = checkFestFiles();
      return Promise.all([linksDone, festDone, pool(imgs, 8, function (im) {
        return get(im.url).catch(function () { return get(im.url); }).then(function (r) { return r.ok ? r : get(im.url); }).then(function (r) {
          if (!r.ok) { im.ok = false; return; }
          return r.blob().then(function (b) {
            im.ok = true; im.size = b.size; im.type = (b.type || '').replace('image/', '');
            im.thumb = URL.createObjectURL(b);
            return new Promise(function (done) { var i = new Image(); i.onload = function () { im.w = i.naturalWidth; im.h = i.naturalHeight; done(); }; i.onerror = done; i.src = im.thumb; });
          });
        }).catch(function () { im.ok = false; });
      })]);
    }).then(function () {
      seoImageChecks();
      imgs.forEach(function (im) {
        if (im.ok === false) say('err', 'Images', im.name + ' is referenced (' + im.pages[0] + ') but does not load.');
        else if (im.size > IMG_ERR) say('err', 'Images', im.name + ' is ' + kb(im.size) + ' (over ' + kb(IMG_ERR) + ').');
        else if (im.size > IMG_WARN) say('warn', 'Images', im.name + ' is ' + kb(im.size) + ' (over ' + kb(IMG_WARN) + ').');
      });
      integrationChecks(); freshnessChecks(smRows);
      X.perf = collectPerf();
      draw(smRows, theme, faq, extra, sm);
      document.getElementById('meta').textContent = 'Loaded ' + new Date().toLocaleTimeString() + ' · ' + sm.length + ' pages · ' + imgs.length + ' images';
    }).catch(function (e) {
      main.replaceChildren(h('div', { class: 'issue err' }, [h('b', null, 'error'), 'Could not read the site: ' + e.message + '. Open this page from the site itself (https://…/admin/data.html or a local server), not as a file.']));
      document.getElementById('meta').textContent = 'Failed';
    });
  }

  function draw(smRows, theme, faq, extra, sm) {
    var main = document.getElementById('main'), y = scrollY;
    last = { smRows: smRows, theme: theme, faq: faq, extra: extra, sm: sm };
    main.replaceChildren(renderAttention(), renderFestivals(), renderClinic(), renderConsistency(), renderDoctors(), renderFaq(faq), renderImages(),
      renderIntegrations(extra), renderLinks(), renderLocations(), renderPerf(), renderSeo(), renderSitemap(smRows, sm), renderTheme(theme), renderTreatments(), renderWhatsApp(waRows));
    scrollTo(0, y);
  }

  /* nav */
  var jump = document.getElementById('jump');
  SECTIONS.forEach(function (s) {
    var a = h('a', { href: '#' + s[0] }, s[1]);
    a.addEventListener('click', function (ev) {
      ev.preventDefault(); var d = document.getElementById(s[0]); if (!d) return; d.open = true;
      d.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
    jump.appendChild(a);
  });
  document.getElementById('reload').addEventListener('click', function () { run(); });
  /* PIN gate. Convenience only: it runs in the browser, so it keeps casual visitors out but is not real security.
     Only a hash of the PIN is stored here. */
  var PIN_HASH = 'f384e8f49727e688740acffa539265ddba51d65e0ad785580f3b446c4d841809', GATE_KEY = 'fw-admin-ok', started = false, fails = 0, lockedUntil = 0;
  function sha(s) { return crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)).then(function (b) { return Array.prototype.map.call(new Uint8Array(b), function (x) { return ('0' + x.toString(16)).slice(-2); }).join(''); }); }
  function unlock() { document.body.classList.remove('locked'); if (!started) { started = true; run(); } }
  function lockNow() { try { sessionStorage.removeItem(GATE_KEY); } catch (e) {} location.reload(); }
  var gateForm = document.getElementById('gate-form'), pinEl = document.getElementById('pin'), errEl = document.getElementById('gate-err');
  document.getElementById('lock').addEventListener('click', lockNow);
  gateForm.addEventListener('submit', function (ev) {
    ev.preventDefault();
    if (!(window.crypto && crypto.subtle)) { errEl.textContent = 'This page must be opened over https or localhost.'; return; }
    var wait = Math.ceil((lockedUntil - Date.now()) / 1000);
    if (wait > 0) { errEl.textContent = 'Too many tries. Wait ' + wait + 's.'; return; }
    sha('flosswork-admin:' + pinEl.value.trim()).then(function (hx) {
      if (hx === PIN_HASH) { try { sessionStorage.setItem(GATE_KEY, hx); } catch (e) {} pinEl.value = ''; errEl.textContent = ''; unlock(); }
      else { fails++; pinEl.value = ''; errEl.textContent = 'Wrong PIN.'; if (fails >= 5) { lockedUntil = Date.now() + 30000; fails = 0; errEl.textContent = 'Too many tries. Wait 30s.'; } pinEl.focus(); }
    });
  });
  var remembered = false; try { remembered = sessionStorage.getItem(GATE_KEY) === PIN_HASH; } catch (e) {}
  if (remembered) unlock(); else setTimeout(function () { pinEl.focus(); }, 50);
})();
</script>
</body>
